quarkus.application.name=casehub-aml

# ── Frontend (Quinoa) ────────────────────────────────────────────────────
# Quinoa is dev-mode only — production assets come from Maven WebJar SNAPSHOTs
# (casehub-pages-npm, casehub-blocks-ui-npm) extracted into META-INF/resources/.
quarkus.quinoa.enabled=false
%dev.quarkus.quinoa.enabled=true
%dev.quarkus.quinoa.build-dir=dist
%dev.quarkus.quinoa.package-manager-install=true
%dev.quarkus.quinoa.package-manager-install.node-version=26.0.0

casehub.platform.config.files=classpath:casehub/aml/trust-routing.yaml

# ── Retention expiry (BSA/AML record-keeping, 31 CFR 1010.430) ────────────
casehub.aml.retention.days=2555
casehub.aml.retention.cron=0 0 2 * * ?

# ── Simulation API (build-time gating) ─────────────────────────────────────
# Only available in dev mode. Production builds have simulation endpoints removed.
%dev.casehub.aml.simulation.enabled=true

# ── RBAC — OIDC disabled in dev; @RolesAllowed annotations are inert ──
%dev.quarkus.oidc.enabled=false

# ============================================================
# Single datasource — all entities (work, qhorus, ledger, AML)
# ============================================================
# After qhorus Panache→JPA migration, both work and qhorus inject @Default
# EntityManager. Unified PU ensures AdditionalJpaModelBuildItem-registered
# entities are discoverable by all stores.

quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:aml;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.username=sa
quarkus.datasource.password=

# Named datasource aliases — same H2 URL, required by named Flyway instances
quarkus.datasource.qhorus.db-kind=h2
quarkus.datasource.qhorus.jdbc.url=jdbc:h2:mem:aml;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.qhorus.username=sa
quarkus.datasource.qhorus.password=
quarkus.datasource.memory.db-kind=h2
quarkus.datasource.memory.jdbc.url=jdbc:h2:mem:aml;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
quarkus.datasource.memory.username=sa
quarkus.datasource.memory.password=

# All entities on the default PU
quarkus.hibernate-orm.packages=io.casehub.work.runtime.model,io.casehub.work.runtime.filter,io.casehub.aml.domain,io.casehub.aml.query,io.casehub.platform.memory.jpa,io.casehub.qhorus.runtime,io.casehub.qhorus.runtime.channel,io.casehub.qhorus.runtime.data,io.casehub.qhorus.runtime.gateway,io.casehub.qhorus.runtime.instance,io.casehub.qhorus.runtime.message,io.casehub.qhorus.runtime.watchdog,io.casehub.ledger.runtime.model,io.casehub.ledger.model,io.casehub.aml.ledger,io.casehub.aml.trust
quarkus.hibernate-orm.database.generation=none

# engine-work-adapter is an explicit compile dep (not transitive); MemoryPlanItemStore displaces JpaPlanItemStore
# so WorkAdapterPlanItemEntity is not required in the JPA context (no Flyway for it).
quarkus.arc.selected-alternatives=io.casehub.persistence.memory.MemoryPlanItemStore,io.casehub.persistence.memory.MemoryReactivePlanItemStore,io.casehub.persistence.memory.InMemoryEventLogRepository,io.casehub.persistence.memory.InMemoryReactiveEventLogRepository,io.casehub.persistence.memory.InMemoryCaseMetaModelRepository,io.casehub.persistence.memory.InMemoryReactiveCaseMetaModelRepository,io.casehub.persistence.memory.InMemoryCaseInstanceRepository,io.casehub.persistence.memory.InMemoryReactiveCaseInstanceRepository,io.casehub.persistence.memory.InMemorySubCaseGroupRepository,io.casehub.persistence.memory.InMemoryReactiveSubCaseGroupRepository
# Tutorial harness CDI exclusions: in-memory engine alternatives displace JPA impls at runtime;
# DefaultTestPrincipal and NoOpGroupMembershipProvider compete with platform mocks.
# TenantScopedPrincipal: casehub-work SNAPSHOT added this @RequestScoped CurrentPrincipal bean.
# AML uses QhorusInboundCurrentPrincipal for tenant context (Qhorus-based architecture).
# TenantScopedPrincipal conflicts as a second non-@DefaultBean CurrentPrincipal — ambiguous with
# QhorusInboundCurrentPrincipal. Excluded here because AML's CDI wiring is Qhorus-first.
quarkus.arc.exclude-types=io.casehub.persistence.memory.DefaultTestPrincipal,\
  io.casehub.work.runtime.service.NoOpGroupMembershipProvider,\
  io.casehub.work.runtime.service.TenantScopedPrincipal,\
  io.casehub.engine.internal.memory.CbrCaseRetainObserver,\
  io.casehub.engine.internal.routing.LeastLoadedAgentStrategy,\
  io.casehub.eidos.runtime.health.DefaultCapabilityHealth

# ── Flyway — three instances with separate history tables (V-number isolation) ─
# Work + AML-query on default Flyway
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/work/migration,classpath:db/aml-query/migration,classpath:db/ledger/migration,classpath:db/aml-ledger/migration,classpath:db/aml-engine-ledger/migration,classpath:db/aml-trust-routing/migration
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.baseline-version=0
# Memory on its own Flyway (V1 collision with work)
quarkus.flyway.memory.migrate-at-start=true
quarkus.flyway.memory.locations=classpath:db/memory/migration
quarkus.flyway.memory.table=flyway_schema_history_memory
quarkus.flyway.memory.baseline-on-migrate=true
quarkus.flyway.memory.baseline-version=0
# Qhorus on its own Flyway (V1 collision with work; ledger moved to default to avoid V1000 collision with qhorus V1)
quarkus.flyway.qhorus.migrate-at-start=true
quarkus.flyway.qhorus.locations=classpath:db/qhorus/migration
quarkus.flyway.qhorus.table=flyway_schema_history_qhorus
quarkus.flyway.qhorus.baseline-on-migrate=true
quarkus.flyway.qhorus.baseline-version=0

casehub.ledger.erasure-receipt.enabled=true

# ============================================================
# Logging
# ============================================================
quarkus.log.level=INFO
quarkus.log.category."io.casehub".level=DEBUG

# ============================================================
# Production overrides — supply via environment variables:
#   QUARKUS_DATASOURCE_JDBC_URL / USERNAME / PASSWORD
#   QUARKUS_DATASOURCE_QHORUS_JDBC_URL / USERNAME / PASSWORD
# ============================================================
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.qhorus.db-kind=postgresql

# casehub-engine modules lack embedded Jandex indices — force scanning at augmentation.
%prod.quarkus.index-dependency.casehub-engine.group-id=io.casehub
%prod.quarkus.index-dependency.casehub-engine.artifact-id=casehub-engine
%prod.quarkus.index-dependency.casehub-engine-common.group-id=io.casehub
%prod.quarkus.index-dependency.casehub-engine-common.artifact-id=casehub-engine-common
%prod.quarkus.index-dependency.engine-work-adapter.group-id=io.casehub
%prod.quarkus.index-dependency.engine-work-adapter.artifact-id=casehub-engine-work-adapter
%prod.quarkus.index-dependency.engine-planning.group-id=io.casehub
%prod.quarkus.index-dependency.engine-planning.artifact-id=casehub-engine-planning
