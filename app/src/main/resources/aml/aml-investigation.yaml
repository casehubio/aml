dsl: "0.1"
version: "1.0.0"
name: aml-investigation
namespace: casehub-aml
title: AML Investigation — adaptive specialist coordination

spec:

  ## ─── Capabilities ───────────────────────────────────────────────────────────
  capabilities:
    - name: entity-resolution
      description: "Resolve beneficial ownership chain from flagged transaction"
      inputProjection: "{ transaction: .transaction }"
      outputProjection: "{ entityResolution: . }"

    - name: pattern-analysis
      description: "Detect layering, structuring, smurfing patterns"
      inputProjection: "{ transaction: .transaction, entityGraph: .entityResolution.ownershipChain }"
      outputProjection: "{ patternAnalysis: . }"

    - name: osint-screening
      description: "Sanctions lists, PEP databases, adverse media screening"
      inputProjection: "{ transaction: .transaction }"
      outputProjection: "{ osintScreening: . }"

    - name: senior-analyst-review
      description: "Senior analyst investigation for PEP entities and high-risk cases"
      inputProjection: "{ transaction: .transaction, entityResolution: .entityResolution }"
      outputProjection: "{ seniorAnalystReview: . }"

    - name: sar-drafting
      description: "Synthesise specialist findings into SAR narrative"
      inputProjection: >-
        { transaction: .transaction,
          entityResolution: .entityResolution,
          patternAnalysis: .patternAnalysis,
          osintScreening: .osintScreening,
          similarSarNarratives: .cbrPathAdvice.similarSarNarratives }
      outputProjection: "{ sarNarrative: .sarNarrative, narrativeSeeded: .narrativeSeeded, seedCount: .seedCount }"

    - name: cbr-path-advisor
      description: "Analyse similar past cases and produce path recommendations"
      inputProjection: "{ cbrExperiences: .cbrExperiences }"
      outputProjection: "{ cbrPathAdvice: . }"

    - name: investigation-triage
      description: "Evaluate specialist findings and decide whether SAR is warranted"
      inputProjection: "{ entityResolution: .entityResolution, patternAnalysis: .patternAnalysis, osintScreening: .osintScreening, cbrPathAdvice: .cbrPathAdvice }"
      outputProjection: "{ investigationTriage: . }"

    - name: compliance-review-opening
      description: "Open compliance officer review WorkItem after MLRO gate approval"
      inputProjection: "{ transaction: .transaction, entityResolution: .entityResolution, patternAnalysis: .patternAnalysis, osintScreening: .osintScreening, sarNarrative: .sarNarrative }"
      outputProjection: "{ complianceTaskId: .complianceTaskId }"

    - name: rejection-review
      description: "Senior analyst reviews case after gate rejection"
      inputProjection: >-
        { transaction: .transaction,
          entityResolution: .entityResolution,
          rejectionContext: .actionGateRejected }
      outputProjection: "{ rejectionReview: . }"

    - name: post-rejection-triage
      description: "Re-evaluate specialist findings with senior analyst review and rejection context"
      inputProjection: >-
        { entityResolution: .entityResolution,
          patternAnalysis: .patternAnalysis,
          osintScreening: .osintScreening,
          cbrPathAdvice: .cbrPathAdvice,
          seniorAnalystReview: .rejectionReview,
          rejectionContext: .actionGateRejected }
      outputProjection: "{ postRejectionTriage: . }"

    - name: sar-drafting-escalated
      description: "Re-draft SAR narrative after head-of-compliance FILE_SAR decision — no PlannedAction gate"
      inputProjection: >-
        { transaction: .transaction,
          entityResolution: .entityResolution,
          patternAnalysis: .patternAnalysis,
          osintScreening: .osintScreening,
          similarSarNarratives: .cbrPathAdvice.similarSarNarratives }
      outputProjection: "{ sarNarrative: .sarNarrative, narrativeSeeded: .narrativeSeeded, seedCount: .seedCount }"

    - name: rejection-escalation
      description: "Escalate to head of compliance when re-triage confirms rejected decision"
      inputProjection: >-
        { transaction: .transaction,
          entityResolution: .entityResolution,
          patternAnalysis: .patternAnalysis,
          osintScreening: .osintScreening,
          rejectionReview: .rejectionReview,
          postRejectionTriage: .postRejectionTriage,
          rejectionContext: .actionGateRejected }
      outputProjection: "{ rejectionEscalation: . }"

    - name: rejection-stall
      description: "Marks investigation as stalled after double rejection"
      inputProjection: "{}"
      outputProjection: "{ investigationStalled: true }"

  ## ─── Goals ──────────────────────────────────────────────────────────────────
  goals:
    - name: investigation-complete
      kind: success
      condition: ".complianceTaskId != null"
    - name: investigation-cleared
      kind: success
      condition: >-
        (.investigationTriage.decision == "FALSE_POSITIVE" or
         .investigationTriage.decision == "INCONCLUSIVE") or
        (.postRejectionTriage.decision == "FALSE_POSITIVE" and
         .actionGateRejected.actionType == "investigation.clearance") or
        .rejectionEscalation.decision == "CLEAR"
    - name: investigation-closed-no-sar
      kind: success
      condition: >-
        (.postRejectionTriage.decision == "FALSE_POSITIVE" and
         .actionGateRejected.actionType == "sar.filing") or
        .rejectionEscalation.decision == "NO_SAR"
    - name: investigation-stalled
      kind: failure
      condition: ".investigationStalled == true"

  ## ─── Completion ─────────────────────────────────────────────────────────────
  completion:
    success:
      anyOf:
        - investigation-complete
        - investigation-cleared
        - investigation-closed-no-sar
    failure:
      anyOf:
        - investigation-stalled

  ## ─── Bindings ────────────────────────────────────────────────────────────────
  bindings:

    ## Fires first — entity resolution has no prior-context prerequisite
    - name: entity-resolution
      on: { contextChange: {} }
      when: ".transaction != null and .entityResolution == null"
      capability: entity-resolution

    ## Fires after entity resolution; runs in parallel with osint-screening
    - name: pattern-analysis
      on: { contextChange: {} }
      when: ".entityResolution != null and .patternAnalysis == null"
      capability: pattern-analysis

    ## Fires after entity resolution; runs in parallel with pattern-analysis
    ## OSINT always declines in Layer 5 stubs — osintScreening.declined=true is
    ## written as a completed result so sar-drafting condition is satisfied
    - name: osint-screening
      on: { contextChange: {} }
      when: ".entityResolution != null and .osintScreening == null"
      capability: osint-screening

    ## Fires at case start when entity has established high-risk history in CaseMemoryStore,
    ## BEFORE entity resolution runs (entityResolution == null ensures exactly-once dispatch:
    ## once entity-resolution writes its result, this condition becomes permanently false).
    - name: senior-analyst-required-prior-context
      on: { contextChange: {} }
      when: >-
        .priorEntityContext.knownHighRisk == true and
        .entityResolution == null and
        .seniorAnalystReview == null
      capability: senior-analyst-review

    ## Fires after entity resolution for first-time encounters: PEP entity type or risk score > 0.8.
    ## Suppressed if prior-context routing already dispatched (priorEntityContext.knownHighRisk != true)
    ## to prevent double dispatch and the Merkle frontier constraint violation it causes.
    - name: senior-analyst-required-resolution
      on: { contextChange: {} }
      when: >-
        .entityResolution != null and
        .priorEntityContext.knownHighRisk != true and
        (.entityResolution.entityType == "PEP" or
         .entityResolution.riskScore > 0.8 or
         (.cbrPathAdvice != null and
          .cbrPathAdvice.active == true and
          .cbrPathAdvice.capabilities["senior-analyst-review"].frequency > 0.6)) and
        .seniorAnalystReview == null
      capability: senior-analyst-review

    ## Fires at case start when retrieved CBR experiences exist.
    - name: cbr-path-advisor
      on: { contextChange: {} }
      when: ".cbrExperiences != null and (.cbrExperiences | length) > 0 and .cbrPathAdvice == null"
      capability: cbr-path-advisor

    ## Fires once all specialist findings are present. Gates on CBR path advice
    ## when experiences exist — waits for the advisor to complete before firing.
    - name: investigation-triage
      on: { contextChange: {} }
      when: >-
        .entityResolution != null and
        .patternAnalysis != null and
        .osintScreening != null and
        .investigationTriage == null and
        (.cbrPathAdvice != null or .cbrExperiences == null or (.cbrExperiences | length) == 0)
      capability: investigation-triage

    ## Fires when triage decides SAR is warranted.
    ## SAR-drafting worker synthesises the narrative and declares PlannedAction(SAR_FILING);
    ## complianceTaskId is set by compliance-review-opening after MLRO gate approval.
    - name: sar-drafting
      on: { contextChange: {} }
      when: >-
        .entityResolution != null and
        .patternAnalysis != null and
        .osintScreening != null and
        .investigationTriage.decision == "SAR_WARRANTED" and
        .sarNarrative == null and
        .actionGateRejected == null
      capability: sar-drafting

    ## Fires after MLRO gate approves SAR filing. The compliance-review-opening worker
    ## creates the compliance officer WorkItem (30-day FinCEN SLA) and writes complianceTaskId.
    - name: compliance-review-opening
      on: { contextChange: {} }
      when: ".sarNarrative != null and .complianceTaskId == null"
      capability: compliance-review-opening

    ## ─── Failure Handling ────────────────────────────────────────────────────────

    ## Pattern analysis worker failed — retry with a different worker.
    ## The engine writes patternAnalysisFailed=true when the worker throws;
    ## this binding clears the failure and retries once.
    - name: pattern-analysis-retry
      on: { contextChange: {} }
      when: >-
        .patternAnalysisFailed == true and
        .patternAnalysisRetryAttempted != true and
        .patternAnalysis == null
      capability: pattern-analysis

    ## Pattern analysis double failure — escalate to senior analyst.
    ## Fires when retry also failed (both patternAnalysisFailed and Retried are true).
    - name: pattern-analysis-escalation
      on: { contextChange: {} }
      when: >-
        .patternAnalysisFailed == true and
        .patternAnalysisRetryAttempted == true and
        .patternAnalysis == null and
        .seniorAnalystReview == null
      capability: senior-analyst-review

    ## OSINT screening failed — escalate to senior analyst.
    ## Distinct from DECLINED (healthy agent refusing): this is a worker error.
    - name: osint-screening-failed-escalation
      on: { contextChange: {} }
      when: >-
        .osintScreeningFailed == true and
        .osintScreening == null and
        .seniorAnalystReview == null
      capability: senior-analyst-review

    ## ─── Rejection Routing ────────────────────────────────────────────

    ## Senior analyst reviews case after any gate rejection.
    - name: rejection-review
      on: { contextChange: {} }
      when: >-
        .actionGateRejected != null and
        .rejectionReview == null
      capability: rejection-review

    ## Re-triage with extended input after senior analyst review.
    - name: post-rejection-triage
      on: { contextChange: {} }
      when: >-
        .actionGateRejected != null and
        .rejectionReview != null and
        .postRejectionTriage == null
      capability: post-rejection-triage

    ## Escalation — fires when re-triage confirms the rejected decision,
    ## or when re-triage produces INCONCLUSIVE (needs human sign-off).
    - name: rejection-escalation
      on: { contextChange: {} }
      when: >-
        .postRejectionTriage != null and
        .rejectionEscalation == null and
        ((.postRejectionTriage.decision == "SAR_WARRANTED"
          and .actionGateRejected.actionType == "sar.filing") or
         .postRejectionTriage.decision == "INCONCLUSIVE")
      capability: rejection-escalation

    ## SAR path re-entry after escalation approves filing.
    ## Head of compliance already approved — no PlannedAction gate.
    - name: sar-drafting-post-escalation
      on: { contextChange: {} }
      when: >-
        .rejectionEscalation.decision == "FILE_SAR" and
        .sarNarrative == null
      capability: sar-drafting-escalated

    ## Stall detection — safety net for future triage decisions without resolution paths.
    ## Excludes SAR_WARRANTED, FALSE_POSITIVE, and INCONCLUSIVE which all have defined
    ## resolution bindings or goals; without these guards, stall races with escalation.
    - name: rejection-stall-detection
      on: { contextChange: {} }
      when: >-
        .actionGateRejected != null and
        .rejectionReview != null and
        .postRejectionTriage != null and
        .rejectionEscalation == null and
        .investigationStalled != true and
        .postRejectionTriage.decision != "SAR_WARRANTED" and
        .postRejectionTriage.decision != "FALSE_POSITIVE" and
        .postRejectionTriage.decision != "INCONCLUSIVE"
      capability: rejection-stall

    ## Rejection-review worker failed — escalate directly to head of compliance,
    ## bypassing re-triage. The case still needs resolution even without review evidence.
    - name: rejection-review-failed-escalation
      on: { contextChange: {} }
      when: >-
        .rejectionReviewFailed == true and
        .rejectionEscalation == null
      capability: rejection-escalation

    ## Officer rejected clearance, re-investigation shows SAR warranted.
    ## Uses sar-drafting-escalated (no PlannedAction) — the rejection cycle already
    ## exhausted the review path; a second MLRO gate would create a dead end because
    ## rejectionReview != null prevents re-entry into rejection routing.
    - name: sar-drafting-after-clearance-rejection
      on: { contextChange: {} }
      when: >-
        .postRejectionTriage.decision == "SAR_WARRANTED" and
        .actionGateRejected.actionType == "investigation.clearance" and
        .sarNarrative == null
      capability: sar-drafting-escalated
