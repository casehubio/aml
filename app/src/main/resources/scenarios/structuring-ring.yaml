scenario: structuring-ring
description: "Structuring ring — pattern detection, parallel specialists, cleared (no SAR)"
speed: 1.0
on-error: pause

meta:
  labels: [demo, pattern, cleared]
  complexity: medium
  duration: 30s

sections:
  - label: "Setup"
    steps:
      - label: "Seed trust model"
        name: seed
        target: aml
        commands:
          - action: seed-trust-scores

  - label: "Structuring Detection"
    steps:
      - label: "Flag a structuring transaction"
        name: start
        target: aml
        trigger: { after: seed, delay: 500 }
        commands:
          - action: start-investigation
            data:
              amount: 9500
              flagReason: STRUCTURING
              originAccount: ACC-STRUCT-001
              destinationAccount: ACC-STRUCT-002
              currency: USD

      - label: "Navigate to investigations"
        name: nav
        target: browser
        trigger: { after: start, delay: 1000 }
        commands:
          - action: click
            target: { role: button, name: "Investigations" }

      - label: "Wait for completion"
        name: wait
        target: aml
        trigger: { after: nav, delay: 1000 }
        commands:
          - action: wait-for-completion
            data:
              caseId: "${result.start.caseId}"
              timeout: 30000

      - label: "View cleared investigation"
        name: view
        target: browser
        trigger: { after: wait, delay: 500 }
        commands:
          - action: click
            target: { role: row, index: 0 }
          - action: spotlight
            target: { role: tab, name: "Overview" }
            data:
              content: >
                Structuring investigation completed — score below SAR threshold.
                Investigation cleared with no SAR filing. The triage worker
                evaluated the evidence and determined the pattern was insufficient
                for a SAR recommendation.
              position: right
              duration: 0
