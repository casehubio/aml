name: Build and Publish

on:
  push:
    branches: [main]
  repository_dispatch:
    types: [upstream-published]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
          cache: 'maven'

      # Published blocks-ui 0.3 requires this parent, absent from GitHub Packages.
      - name: Check out CaseHub parent 0.3
        uses: actions/checkout@v4
        with:
          repository: casehubio/parent
          ref: a5766dfb227917c72ba681dc2971b780fd1fab00 # v0.3
          path: .ci/casehub-parent

      - name: Install CaseHub parent 0.3
        run: mvn --batch-mode -N -f .ci/casehub-parent/pom.xml install

      - name: Build and test
        run: mvn --batch-mode -U test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Surefire reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
          if-no-files-found: ignore
          retention-days: 5

      - name: Publish to GitHub Packages
        if: github.event_name != 'pull_request'
        run: mvn --batch-mode -U deploy -DskipTests -Dquarkus.build.skip=true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
